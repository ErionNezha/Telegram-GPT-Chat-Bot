<!DOCTYPE html>
<!-- Created by Erion Nezha — © 2026 All rights reserved -->
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram GPT Chat Bot — Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#0e1621; color:#fff;
         display:flex; justify-content:center; align-items:center; min-height:100vh; padding:16px; }
  .phone { width:100%; max-width:440px; height:680px; max-height:94vh; background:#0e1621;
           border-radius:24px; overflow:hidden; display:flex; flex-direction:column;
           box-shadow:0 20px 60px rgba(0,0,0,.6); border:1px solid #1c2b3f; }
  .chat-header { background:#17212b; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .avatar { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#10a37f,#0d7a5f);
            display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .chat-name { font-weight:600; font-size:15px; }
  .chat-status { font-size:12px; color:#37aee2; }
  .sim-badge { background:#1c2b3f; color:#8b9bab; font-size:11px; text-align:center; padding:6px 10px; }
  .sim-badge b { color:#f5c542; }
  .messages { flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; font-size:14px; line-height:1.5;
         animation:pop .25s ease; word-wrap:break-word; white-space:pre-wrap; }
  @keyframes pop { from { transform:scale(.92); opacity:0; } to { transform:scale(1); opacity:1; } }
  .msg.me { align-self:flex-end; background:#2b5278; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:#182533; border-bottom-left-radius:4px; }
  .msg .time { display:block; font-size:10px; color:#8b9bab; text-align:right; margin-top:4px; }
  .typing { align-self:flex-start; background:#182533; padding:12px 16px; border-radius:12px; display:flex; gap:5px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:#8b9bab; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
  .input-bar { background:#17212b; padding:10px 12px; display:flex; gap:8px; align-items:center; }
  .input-bar input { flex:1; background:#0e1621; border:none; outline:none; color:#fff; font-size:14px;
                     padding:10px 14px; border-radius:20px; }
  .input-bar button { width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
                      background:#2b5278; color:#fff; font-size:18px; flex-shrink:0; }
  .input-bar button:hover { background:#37aee2; }
  .hint { text-align:center; color:#5b6b7c; font-size:12px; padding:8px; }
  footer { text-align:center; color:#5b6b7c; font-size:12px; padding:10px; background:#17212b; }
  footer b { color:#8b9bab; }
</style>
</head>
<body>
<div class="phone">
  <div class="chat-header">
    <div class="avatar">🧠</div>
    <div>
      <div class="chat-name">GPT Chat Bot</div>
      <div class="chat-status">online — përgjigjet me AI</div>
    </div>
  </div>
  <div class="sim-badge"><b>SIMULIM EDUKATIV</b> — versioni real lidhet me GPT API</div>
  <div class="messages" id="messages"></div>
  <div class="hint">Bëj një pyetje — boti "mendon" dhe përgjigjet 👇</div>
  <div class="input-bar">
    <input type="text" id="input" placeholder="Shkruaj pyetjen tënde..." autocomplete="off">
    <button id="send" aria-label="Dërgo">➤</button>
  </div>
  <footer>Krijuar nga <b>Erion Nezha</b></footer>
</div>
<script>
(function () {
  'use strict';
  var box = document.getElementById('messages');
  var input = document.getElementById('input');

  function now() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function addMsg(text, who) {
    var div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = esc(text).replace(/\n/g, '<br>') + '<span class="time">' + now() + '</span>';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  function showTyping() {
    var t = document.createElement('div');
    t.className = 'typing'; t.id = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    box.appendChild(t); box.scrollTop = box.scrollHeight;
  }
  function hideTyping() { var t = document.getElementById('typing'); if (t) t.remove(); }

  var RULES = [
    { k: ['përshëndetje', 'hello', 'hi', 'hej', 'cka', 'ckemi', 'mirëdita', 'mirmëngjes', 'mirëmbrëma'],
      r: ['Përshëndetje! 👋 Si mund të të ndihmoj sot?',
          'Hej! 😊 Pyetmë lirisht për çfarë të duash.'] },
    { k: ['kush je', 'who are you', 'emri yt', 'your name', 'si quhesh'],
      r: ['Unë jam GPT Chat Bot 🤖 — një asistent virtual që përgjigjet në Telegram. Në këtë demo jam simulim; versioni real lidhet me GPT API.'] },
    { k: ['ndihmë', 'help', 'cfare di', 'what can you', 'ndihmo'],
      r: ['Mund të më pyesësh për shumë gjëra: motin 🌤️, orën 🕐, barcaleta 😄, këshilla 💡, apo thjesht të bisedojmë!'] },
    { k: ['ora', 'time', 'sa është ora', 'what time'],
      r: function () { var d = new Date(); return 'Ora tani është ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' 🕐'; } },
    { k: ['moti', 'weather', 'kohë', 'si është moti'],
      r: ['Sot pritet mot i kthjellët me temperatura të këndshme 🌤️ — por kontrollo parashikimin lokal për saktësi!'] },
    { k: ['barcaletë', 'joke', 'tregom diçka qesharake', 'funny'],
      r: ['Pse programuesit ngatërrojnë Halloween-in me Krishtlindjet? Sepse OCT 31 == DEC 25! 😄',
          'Një SQL query hyn në bar, sheh dy tabela dhe pyet: "Mind if I join you?" 😂'] },
    { k: ['faleminderit', 'thanks', 'thank you', 'flm'],
      r: ['Me kënaqësi! 😊 Jam këtu kur të duash.'] },
    { k: ['mirupafshim', 'bye', 'goodbye', 'tung', 'natën e mirë'],
      r: ['Mirupafshim! 👋 Ishte kënaqësi të bisedoja me ty.'] },
    { k: ['dashuri', 'love', 'zemër'],
      r: ['Dashuria është forca më e bukur në botë ❤️ — kujdesu për njerëzit që do!'] },
    { k: ['python', 'programim', 'kod', 'code'],
      r: ['Python është gjuhë e shkëlqyer për fillestarë 🐍 — e thjeshtë, e fuqishme dhe me komunitet të madh!'] },
    { k: ['si je', 'how are you', 'qysh je'],
      r: ['Jam shumë mirë, faleminderit që pyet! ⚡ Po ti, si je?'] },
    { k: ['sa vjeç', 'mosha', 'age'],
      r: ['Unë jam një bot — nuk kam moshë, por "linda" kur dikush ekzekutoi kodin tim për herë të parë! 🤖'] }
  ];
  var FALLBACK = [
    'Hmm, interesante! 🤔 Më trego më shumë për këtë.',
    'E kuptova! Në versionin real me GPT do të merrje një përgjigje të plotë për këtë pyetje. 💡',
    'Pyetje e mirë! Më jep pak më shumë detaje që të të ndihmoj më saktë. 📝',
    'Po mendoj... 🤖 Në versionin real do ta procesoja këtë me inteligjencë artificiale të vërtetë!'
  ];

  function replyFor(text) {
    var t = ' ' + text.toLowerCase() + ' ';
    for (var i = 0; i < RULES.length; i++) {
      for (var j = 0; j < RULES[i].k.length; j++) {
        if (t.indexOf(RULES[i].k[j]) !== -1) {
          var r = RULES[i].r;
          if (typeof r === 'function') return r();
          return r[Math.floor(Math.random() * r.length)];
        }
      }
    }
    return FALLBACK[Math.floor(Math.random() * FALLBACK.length)];
  }

  function send() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg(text, 'me');
    showTyping();
    setTimeout(function () {
      hideTyping();
      addMsg(replyFor(text), 'bot');
    }, 1200 + Math.random() * 800);
  }
  document.getElementById('send').addEventListener('click', send);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  setTimeout(function () { addMsg('👋 Përshëndetje! Unë jam GPT Chat Bot. Bëjm një pyetje!', 'bot'); }, 400);
})();
</script>
</body>
</html>
